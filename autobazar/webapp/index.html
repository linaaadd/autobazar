<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AutoBazar NL</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:var(--tg-theme-bg-color,#1c1c1e);
  --bg2:var(--tg-theme-secondary-bg-color,#2c2c2e);
  --text:var(--tg-theme-text-color,#fff);
  --hint:var(--tg-theme-hint-color,#8e8e93);
  --link:var(--tg-theme-link-color,#3a8fd9);
  --btn:var(--tg-theme-button-color,#185fa5);
  --btntext:var(--tg-theme-button-text-color,#fff);
  --sep:rgba(128,128,128,0.18);
  --danger:#ff453a;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:68px;overflow-x:hidden}

/* TAB BAR */
#tabbar{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;background:var(--bg2);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 11px;background:none;border:none;cursor:pointer;color:var(--hint);font-size:10px;transition:color .15s}
.tab.active{color:var(--link)}
.tab-icon{font-size:22px}

/* SCREENS */
.screen{display:none}.screen.active{display:block}
.screen-header{padding:16px 16px 10px;font-size:20px;font-weight:700;letter-spacing:-.3px}

/* FILTER BUTTONS */
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 12px}
.fbtn{background:var(--bg2);border:.5px solid var(--sep);border-radius:13px;padding:10px 12px;text-align:left;cursor:pointer;color:inherit;transition:border-color .15s}
.fbtn.has-val{border-color:var(--link)}
.fbtn-label{font-size:11px;color:var(--hint);display:block;margin-bottom:3px}
.fbtn-val{font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:space-between;gap:4px}
.fbtn.has-val .fbtn-val{color:var(--link)}
.fbtn-arrow{opacity:.5;font-size:15px}

/* ACTIVE SUMMARY */
.active-summary{margin:0 12px 10px;background:var(--bg2);border-radius:12px;padding:10px 13px;border-left:3px solid var(--link);font-size:13px}
.active-summary-label{font-size:11px;font-weight:600;color:var(--link);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.active-summary-val{color:var(--hint);font-style:italic}

/* PRIMARY BUTTON */
.primary-btn{display:block;width:calc(100% - 24px);margin:6px 12px;padding:14px;background:var(--btn);color:var(--btntext);border:none;border-radius:13px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s}
.primary-btn:active{opacity:.8}
.primary-btn.danger{background:var(--danger)}

/* PANEL OVERLAY */
#panel-overlay{position:fixed;inset:0;z-index:200;background:var(--bg);transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
#panel-overlay.open{transform:translateX(0)}
.panel-nav{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:.5px solid var(--sep);flex-shrink:0}
.back-btn{background:none;border:none;color:var(--link);font-size:15px;cursor:pointer;padding:6px 10px 6px 0;display:flex;align-items:center;gap:4px}
.panel-nav-title{font-size:17px;font-weight:600}
.panel-body{padding:16px;overflow-y:auto;flex:1}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:.5px solid var(--sep);border-radius:20px;padding:7px 15px;font-size:14px;cursor:pointer;background:var(--bg2);color:var(--text);transition:all .15s}
.chip.sel{background:rgba(58,143,217,.15);border-color:var(--link);color:var(--link);font-weight:500}
.chip.sel::before{content:"✓ "}

/* INPUTS */
.inp{width:100%;padding:11px 13px;background:var(--bg2);border:.5px solid var(--sep);border-radius:11px;font-size:14px;color:var(--text);outline:none;font-family:inherit}
.inp:focus{border-color:var(--link)}
.inp::placeholder{color:var(--hint)}
.range-row{display:flex;gap:8px;margin-top:10px}
.range-row .inp{flex:1}
.search-inp-wrap{position:relative;margin-bottom:12px}
.search-inp-wrap .inp{padding-left:36px}
.search-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none}
.section-label{font-size:12px;color:var(--hint);margin:14px 0 8px;font-weight:500}

/* PUBLISH FORM */
.form-sep{margin:8px 0 0;padding:10px 14px 4px;font-size:12px;font-weight:600;color:var(--hint);text-transform:uppercase;letter-spacing:.5px}
.req::after{content:" *";color:#ff6b6b}
.form-field{padding:0 12px 10px}
.form-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.form-chip{border:.5px solid var(--sep);border-radius:20px;padding:6px 13px;font-size:13px;cursor:pointer;background:var(--bg2);color:var(--text);transition:all .15s}
.form-chip.sel{background:rgba(58,143,217,.15);border-color:var(--link);color:var(--link);font-weight:500}
.form-inp{width:100%;padding:12px 13px;background:var(--bg2);border:.5px solid var(--sep);border-radius:11px;font-size:14px;color:var(--text);outline:none;font-family:inherit}
.form-inp:focus{border-color:var(--link)}
.form-inp::placeholder{color:var(--hint)}
textarea.form-inp{resize:none;min-height:88px;line-height:1.45}
.info-note{margin:0 12px 12px;background:var(--bg2);border-radius:11px;padding:10px 13px;font-size:12px;color:var(--hint);border-left:2px solid var(--link)}

/* RESET FILTERS */
.reset-link{font-size:13px;color:var(--link);background:none;border:none;cursor:pointer;padding:4px 12px 10px;display:block}
</style>
</head>
<body>
<div id="app">

  <!-- SEARCH SCREEN -->
  <div class="screen active" id="screen-search">
    <div class="screen-header">🔍 Поиск авто</div>
    <div class="active-summary">
      <div class="active-summary-label">Фильтры</div>
      <div class="active-summary-val" id="summary-text">ничего не выбрано</div>
    </div>
    <div class="filter-grid">
      <button class="fbtn" id="fb-brand" onclick="openPanel('brand')">
        <span class="fbtn-label">Марка</span>
        <span class="fbtn-val"><span id="v-brand">Любая</span><span class="fbtn-arrow">›</span></span>
      </button>
      <button class="fbtn" id="fb-year" onclick="openPanel('year')">
        <span class="fbtn-label">Год выпуска</span>
        <span class="fbtn-val"><span id="v-year">Любой</span><span class="fbtn-arrow">›</span></span>
      </button>
      <button class="fbtn" id="fb-price" onclick="openPanel('price')">
        <span class="fbtn-label">Цена (€)</span>
        <span class="fbtn-val"><span id="v-price">Любая</span><span class="fbtn-arrow">›</span></span>
      </button>
      <button class="fbtn" id="fb-fuel" onclick="openPanel('fuel')">
        <span class="fbtn-label">Топливо</span>
        <span class="fbtn-val"><span id="v-fuel">Любое</span><span class="fbtn-arrow">›</span></span>
      </button>
      <button class="fbtn" id="fb-trans" onclick="openPanel('trans')">
        <span class="fbtn-label">Коробка</span>
        <span class="fbtn-val"><span id="v-trans">Любая</span><span class="fbtn-arrow">›</span></span>
      </button>
      <button class="fbtn" id="fb-city" onclick="openPanel('city')">
        <span class="fbtn-label">Город</span>
        <span class="fbtn-val"><span id="v-city">Любой</span><span class="fbtn-arrow">›</span></span>
      </button>
    </div>
    <button class="reset-link" onclick="resetFilters()">✕ Сбросить фильтры</button>
    <button class="primary-btn" onclick="doSearch()">🔍 Найти автомобили</button>
  </div>

  <!-- PUBLISH SCREEN -->
  <div class="screen" id="screen-publish">
    <div class="screen-header">📝 Подать объявление</div>
    <div class="info-note">💡 После заполнения формы бот попросит загрузить фотографии</div>

    <div class="form-sep req">Марка</div>
    <div class="form-field">
      <div class="form-chips" id="chips-make">
        <button class="form-chip" onclick="pickChip('make',this,'Toyota')">Toyota</button>
        <button class="form-chip" onclick="pickChip('make',this,'BMW')">BMW</button>
        <button class="form-chip" onclick="pickChip('make',this,'Mercedes')">Mercedes</button>
        <button class="form-chip" onclick="pickChip('make',this,'Volkswagen')">Volkswagen</button>
        <button class="form-chip" onclick="pickChip('make',this,'Audi')">Audi</button>
        <button class="form-chip" onclick="pickChip('make',this,'Škoda')">Škoda</button>
        <button class="form-chip" onclick="pickChip('make',this,'Ford')">Ford</button>
        <button class="form-chip" onclick="pickChip('make',this,'Hyundai')">Hyundai</button>
        <button class="form-chip" onclick="pickChip('make',this,'Kia')">Kia</button>
        <button class="form-chip" onclick="pickChip('make',this,'Opel')">Opel</button>
        <button class="form-chip" onclick="pickChip('make',this,'Renault')">Renault</button>
        <button class="form-chip" onclick="pickChip('make',this,'Volvo')">Volvo</button>
        <button class="form-chip" onclick="pickChip('make',this,'Peugeot')">Peugeot</button>
        <button class="form-chip" onclick="pickChip('make',this,'Mazda')">Mazda</button>
        <button class="form-chip" onclick="pickChip('make',this,'Honda')">Honda</button>
        <button class="form-chip" onclick="pickChip('make',this,'Nissan')">Nissan</button>
      </div>
      <input class="form-inp" id="f-make-custom" placeholder="Другая марка…" oninput="if(this.value.trim()){clearGroupChips('chips-make');pub.make=''}" style="margin-top:6px">
    </div>

    <div class="form-sep req">Модель</div>
    <div class="form-field">
      <input class="form-inp" id="f-model" placeholder="Например: Camry, X5, Golf…">
    </div>

    <div class="form-sep req">Год выпуска</div>
    <div class="form-field">
      <div class="form-chips" id="chips-year-pub"></div>
      <input class="form-inp" id="f-year-custom" type="number" placeholder="Другой год…" min="1990" max="2026" style="margin-top:6px">
    </div>

    <div class="form-sep req">Пробег (км)</div>
    <div class="form-field">
      <input class="form-inp" id="f-mileage" type="number" placeholder="Например: 75 000">
    </div>

    <div class="form-sep req">Цена (€)</div>
    <div class="form-field">
      <input class="form-inp" id="f-price" type="number" placeholder="Например: 14 500">
    </div>

    <div class="form-sep req">Топливо</div>
    <div class="form-field">
      <div class="form-chips">
        <button class="form-chip" onclick="pickChip('fuel',this,'Бензин')">Бензин</button>
        <button class="form-chip" onclick="pickChip('fuel',this,'Дизель')">Дизель</button>
        <button class="form-chip" onclick="pickChip('fuel',this,'Газ/Бензин')">Газ/Бензин</button>
        <button class="form-chip" onclick="pickChip('fuel',this,'Электро')">Электро</button>
        <button class="form-chip" onclick="pickChip('fuel',this,'Гибрид')">Гибрид</button>
      </div>
    </div>

    <div class="form-sep req">Коробка передач</div>
    <div class="form-field">
      <div class="form-chips" id="chips-trans-pub">
        <button class="form-chip" onclick="pickChip('transmission',this,'Автомат')">Автомат</button>
        <button class="form-chip" onclick="pickChip('transmission',this,'Механика')">Механика</button>
      </div>
      <input class="form-inp" id="f-trans-custom" placeholder="Другая коробка…" oninput="if(this.value.trim()){clearGroupChips('chips-trans-pub');pub.transmission=''}" style="margin-top:6px">
    </div>

    <div class="form-sep">Объём двигателя (л)</div>
    <div class="form-field">
      <div class="form-chips" id="chips-engine-pub">
        <button class="form-chip" onclick="pickChip('engine',this,'1.0')">1.0</button>
        <button class="form-chip" onclick="pickChip('engine',this,'1.2')">1.2</button>
        <button class="form-chip" onclick="pickChip('engine',this,'1.4')">1.4</button>
        <button class="form-chip" onclick="pickChip('engine',this,'1.6')">1.6</button>
        <button class="form-chip" onclick="pickChip('engine',this,'1.8')">1.8</button>
        <button class="form-chip" onclick="pickChip('engine',this,'2.0')">2.0</button>
        <button class="form-chip" onclick="pickChip('engine',this,'2.5')">2.5</button>
        <button class="form-chip" onclick="pickChip('engine',this,'3.0')">3.0</button>
        <button class="form-chip" onclick="pickChip('engine',this,'3.5')">3.5</button>
        <button class="form-chip" onclick="pickChip('engine',this,'4.0')">4.0</button>
      </div>
      <input class="form-inp" id="f-engine-custom" placeholder="Другой объём (напр. 2.2)…" oninput="if(this.value.trim()){clearGroupChips('chips-engine-pub');pub.engine=''}" style="margin-top:6px">
    </div>

    <div class="form-sep req">Город</div>
    <div class="form-field">
      <div class="form-chips" id="chips-city-pub">
        <button class="form-chip" onclick="pickChip('city',this,'Amsterdam')">Amsterdam</button>
        <button class="form-chip" onclick="pickChip('city',this,'Rotterdam')">Rotterdam</button>
        <button class="form-chip" onclick="pickChip('city',this,'Utrecht')">Utrecht</button>
        <button class="form-chip" onclick="pickChip('city',this,'Den Haag')">Den Haag</button>
        <button class="form-chip" onclick="pickChip('city',this,'Eindhoven')">Eindhoven</button>
        <button class="form-chip" onclick="pickChip('city',this,'Tilburg')">Tilburg</button>
        <button class="form-chip" onclick="pickChip('city',this,'Groningen')">Groningen</button>
        <button class="form-chip" onclick="pickChip('city',this,'Almere')">Almere</button>
        <button class="form-chip" onclick="pickChip('city',this,'Breda')">Breda</button>
        <button class="form-chip" onclick="pickChip('city',this,'Nijmegen')">Nijmegen</button>
        <button class="form-chip" onclick="pickChip('city',this,'Arnhem')">Arnhem</button>
        <button class="form-chip" onclick="pickChip('city',this,'Haarlem')">Haarlem</button>
      </div>
      <input class="form-inp" id="f-city-custom" placeholder="Другой город…" oninput="if(this.value.trim()){clearGroupChips('chips-city-pub');pub.city=''}" style="margin-top:6px">
    </div>

    <div class="form-sep">Телефон</div>
    <div class="form-field">
      <input class="form-inp" id="f-phone" type="tel" placeholder="+31 6 12345678">
    </div>

    <div class="form-sep req">Описание</div>
    <div class="form-field">
      <textarea class="form-inp" id="f-description" rows="5"
        placeholder="Расскажите о состоянии, комплектации, истории обслуживания…"></textarea>
    </div>

    <button class="primary-btn" onclick="doPublish()" style="margin-top:4px;margin-bottom:4px">📤 Отправить данные боту</button>
    <div style="height:4px"></div>
  </div>

</div>

<!-- FILTER PANEL -->
<div id="panel-overlay">
  <div class="panel-nav">
    <button class="back-btn" onclick="closePanel()">‹ Назад</button>
    <span class="panel-nav-title" id="panel-title">Фильтр</span>
    <button class="back-btn" style="margin-left:auto;color:var(--danger)" onclick="clearCurFilter()">Сбросить</button>
  </div>
  <div class="panel-body" id="panel-body"></div>
</div>

<!-- TAB BAR -->
<div id="tabbar">
  <button class="tab active" id="tab-search" onclick="showTab('search')">
    <span class="tab-icon">🔍</span><span>Поиск</span>
  </button>
  <button class="tab" id="tab-publish" onclick="showTab('publish')">
    <span class="tab-icon">📝</span><span>Подать</span>
  </button>
</div>

<script>
const tg = window.Telegram?.WebApp ?? {
  ready(){}, expand(){}, sendData(d){alert('→ Bot data:\n'+d)},
  showAlert(m,cb){alert(m);cb&&cb()}, close(){}
};
tg.ready(); tg.expand();

// ── SEARCH STATE ──
const sv = { brands:[], year_from:'', year_to:'', price_from:'', price_to:'', fuel:'', transmission:'', city:'' };

const BRANDS = ['Toyota','BMW','Mercedes','Volkswagen','Audi','Škoda','Ford',
  'Hyundai','Kia','Opel','Renault','Volvo','Peugeot','Mazda','Honda','Nissan'];
const NL_CITIES = ['Amsterdam','Rotterdam','Utrecht','Den Haag','Eindhoven','Tilburg',
  'Groningen','Almere','Breda','Nijmegen','Arnhem','Haarlem','Zaandam','Amersfoort','Apeldoorn','Hoofddorp'];

let curPanel = '';

const PANELS = {
  brand: {
    title: 'Марка (можно несколько)',
    build() {
      const chips = BRANDS.map(b => {
        const sel = sv.brands.includes(b);
        return `<button class="chip${sel?' sel':''}" onclick="toggleBrand('${b}',this)">${b}</button>`;
      }).join('');
      return `
        <div class="chips" id="brand-chips">${chips}</div>
        <div class="section-label">Или введите вручную:</div>
        <input class="inp" id="brand-other" placeholder="Другая марка…">
        <button class="primary-btn" style="margin-top:14px" onclick="applyBrand()">Применить</button>`;
    }
  },
  year: {
    title: 'Год выпуска',
    build() {
      return `
        <div class="section-label">Диапазон лет:</div>
        <div class="range-row">
          <input class="inp" id="y-from" type="number" placeholder="От" min="1990" max="2026" value="${sv.year_from}">
          <input class="inp" id="y-to"   type="number" placeholder="До" min="1990" max="2026" value="${sv.year_to}">
        </div>
        <button class="primary-btn" style="margin-top:14px" onclick="applyYear()">Применить</button>`;
    }
  },
  price: {
    title: 'Цена (€)',
    build() {
      const presets = [[5000,'5 000'],[10000,'10 000'],[15000,'15 000'],[20000,'20 000'],[30000,'30 000'],[50000,'50 000']];
      const maxChips = presets.map(([v,l]) =>
        `<button class="chip${sv.price_to==v?' sel':''}" onclick="setPresetMax(${v},this)">до €${l}</button>`
      ).join('');
      return `
        <div class="section-label">Диапазон цены:</div>
        <div class="range-row">
          <input class="inp" id="p-from" type="number" placeholder="От €" value="${sv.price_from}" oninput="clearMaxChips()">
          <input class="inp" id="p-to"   type="number" placeholder="До €" value="${sv.price_to}"   oninput="clearMaxChips()">
        </div>
        <div class="section-label">Быстрый выбор максимума:</div>
        <div class="chips" id="price-chips">${maxChips}</div>
        <button class="primary-btn" style="margin-top:14px" onclick="applyPrice()">Применить</button>`;
    }
  },
  fuel: {
    title: 'Топливо',
    build() {
      return `<div class="chips">${['Бензин','Дизель','Газ/Бензин','Электро','Гибрид'].map(f =>
        `<button class="chip${sv.fuel===f?' sel':''}" onclick="pickS('fuel',this,'${f}');closePanel()">${f}</button>`
      ).join('')}</div>`;
    }
  },
  trans: {
    title: 'Коробка передач',
    build() {
      return `<div class="chips">${['Автомат','Механика'].map(t =>
        `<button class="chip${sv.transmission===t?' sel':''}" onclick="pickS('transmission',this,'${t}');closePanel()">${t}</button>`
      ).join('')}
      </div>
      <div class="section-label">Или введите вручную:</div>
      <input class="inp" id="trans-other" placeholder="Другая коробка…" value="${!['Автомат','Механика',''].includes(sv.transmission)?sv.transmission:''}">
      <button class="primary-btn" style="margin-top:14px" onclick="applyTrans()">Применить</button>`;
    }
  },
  city: {
    title: 'Город',
    build() {
      const chips = NL_CITIES.map(c =>
        `<button class="chip${sv.city===c?' sel':''}" data-city="${c}" onclick="pickCity('${c}',this)">${c}</button>`
      ).join('');
      return `
        <div class="search-inp-wrap">
          <span class="search-ico">🔍</span>
          <input class="inp" id="city-search" placeholder="Поиск города…" oninput="filterCities(this.value)">
        </div>
        <div class="chips" id="city-chips">${chips}</div>
        <div class="section-label">Или введите вручную:</div>
        <input class="inp" id="city-other" placeholder="Другой город…" value="${!NL_CITIES.includes(sv.city)?sv.city:''}">
        <button class="primary-btn" style="margin-top:14px" onclick="applyCity()">Применить</button>`;
    }
  }
};

function openPanel(id) {
  curPanel = id;
  const p = PANELS[id];
  document.getElementById('panel-title').textContent = p.title;
  document.getElementById('panel-body').innerHTML = p.build();
  document.getElementById('panel-overlay').classList.add('open');
}
function closePanel() {
  document.getElementById('panel-overlay').classList.remove('open');
  updateSummary();
}
function clearCurFilter() {
  if (curPanel === 'brand')  { sv.brands = []; updateFbtn('brand','v-brand','Любая'); }
  if (curPanel === 'year')   { sv.year_from=''; sv.year_to=''; updateFbtn('year','v-year','Любой'); }
  if (curPanel === 'price')  { sv.price_from=''; sv.price_to=''; updateFbtn('price','v-price','Любая'); }
  if (curPanel === 'fuel')   { sv.fuel=''; updateFbtn('fuel','v-fuel','Любое'); }
  if (curPanel === 'trans')  { sv.transmission=''; updateFbtn('trans','v-trans','Любая'); }
  if (curPanel === 'city')   { sv.city=''; updateFbtn('city','v-city','Любой'); }
  closePanel();
}

// Brand multi-toggle
function toggleBrand(b, el) {
  const idx = sv.brands.indexOf(b);
  if (idx >= 0) { sv.brands.splice(idx,1); el.classList.remove('sel'); }
  else { sv.brands.push(b); el.classList.add('sel'); }
}
function applyBrand() {
  const inp = document.getElementById('brand-other');
  if (inp && inp.value.trim()) {
    const custom = inp.value.trim();
    if (!sv.brands.includes(custom)) sv.brands.push(custom);
  }
  const val = sv.brands.length ? sv.brands.join(', ') : '';
  updateFbtn('brand','v-brand', val || 'Любая');
  closePanel();
}

// Year
function applyYear() {
  sv.year_from = parseInt(document.getElementById('y-from').value)||'';
  sv.year_to   = parseInt(document.getElementById('y-to').value)||'';
  const label = sv.year_from&&sv.year_to ? `${sv.year_from}–${sv.year_to}` :
                sv.year_from ? `от ${sv.year_from}` : sv.year_to ? `до ${sv.year_to}` : '';
  updateFbtn('year','v-year', label || 'Любой');
  closePanel();
}

// Price
function setPresetMax(v, el) {
  sv.price_to = v;
  document.getElementById('p-to').value = v;
  document.getElementById('price-chips').querySelectorAll('.chip').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');
}
function clearMaxChips() {
  const chips = document.getElementById('price-chips');
  if (chips) chips.querySelectorAll('.chip').forEach(c=>c.classList.remove('sel'));
}
function applyPrice() {
  sv.price_from = parseInt(document.getElementById('p-from').value)||'';
  sv.price_to   = parseInt(document.getElementById('p-to').value)||'';
  const fmt = v => '€'+Number(v).toLocaleString('ru');
  const label = sv.price_from&&sv.price_to ? `${fmt(sv.price_from)}–${fmt(sv.price_to)}` :
                sv.price_from ? `от ${fmt(sv.price_from)}` : sv.price_to ? `до ${fmt(sv.price_to)}` : '';
  updateFbtn('price','v-price', label || 'Любая');
  closePanel();
}

// Generic single-select
function pickS(key, el, val) {
  sv[key] = val;
  if (el && el.parentElement)
    el.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('sel'));
  el?.classList.add('sel');
}

// Trans with custom
function applyTrans() {
  const inp = document.getElementById('trans-other');
  if (inp && inp.value.trim()) sv.transmission = inp.value.trim();
  updateFbtn('trans','v-trans', sv.transmission || 'Любая');
  closePanel();
}

// City with search
function filterCities(q) {
  const chips = document.getElementById('city-chips');
  if (!chips) return;
  chips.querySelectorAll('.chip').forEach(c => {
    c.style.display = c.dataset.city.toLowerCase().includes(q.toLowerCase()) ? '' : 'none';
  });
}
function pickCity(c, el) {
  sv.city = c;
  document.getElementById('city-chips').querySelectorAll('.chip').forEach(x=>x.classList.remove('sel'));
  el.classList.add('sel');
}
function applyCity() {
  const inp = document.getElementById('city-other');
  if (inp && inp.value.trim() && !sv.city) sv.city = inp.value.trim();
  updateFbtn('city','v-city', sv.city || 'Любой');
  closePanel();
}

function updateFbtn(fb, v, label) {
  const fbEl = document.getElementById('fb-'+fb);
  document.getElementById(v).textContent = label;
  const hasVal = label!=='Любая'&&label!=='Любой'&&label!=='Любое';
  fbEl.classList.toggle('has-val', hasVal);
}

function updateSummary() {
  const parts = [];
  if (sv.brands.length)           parts.push(sv.brands.join(', '));
  if (sv.year_from||sv.year_to)   parts.push((sv.year_from||'?')+' – '+(sv.year_to||'?'));
  if (sv.price_from||sv.price_to) {
    const fmt = v => v ? '€'+Number(v).toLocaleString('ru') : '?';
    parts.push(fmt(sv.price_from)+' – '+fmt(sv.price_to));
  }
  if (sv.fuel)           parts.push(sv.fuel);
  if (sv.transmission)   parts.push(sv.transmission);
  if (sv.city)           parts.push(sv.city);
  const el = document.getElementById('summary-text');
  el.textContent = parts.length ? parts.join(' · ') : 'ничего не выбрано';
  el.style.fontStyle = parts.length ? 'normal' : 'italic';
  el.style.color = parts.length ? 'var(--text)' : 'var(--hint)';
}

function resetFilters() {
  Object.assign(sv, {brands:[], year_from:'', year_to:'', price_from:'', price_to:'', fuel:'', transmission:'', city:''});
  [['brand','v-brand','Любая'],['year','v-year','Любой'],['price','v-price','Любая'],
   ['fuel','v-fuel','Любое'],['trans','v-trans','Любая'],['city','v-city','Любой']
  ].forEach(([fb,v,d]) => updateFbtn(fb,v,d));
  updateSummary();
}

function doSearch() {
  const data = {
    action:'search',
    brands: sv.brands.length ? sv.brands : null,
    year_from: sv.year_from||null, year_to: sv.year_to||null,
    price_from: sv.price_from||null, price_to: sv.price_to||null,
    fuel: sv.fuel||null, transmission: sv.transmission||null, city: sv.city||null
  };
  tg.sendData(JSON.stringify(data));
}

// ── PUBLISH STATE ──
const pub = {make:'',model:'',year:'',mileage:'',price:'',fuel:'',transmission:'',engine:'',city:'',phone:'',description:''};

function pickChip(key, el, val) {
  pub[key] = val;
  const container = el.closest('.form-chips');
  if (container) container.querySelectorAll('.form-chip').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');
}
function clearGroupChips(containerId) {
  document.getElementById(containerId)?.querySelectorAll('.form-chip').forEach(c=>c.classList.remove('sel'));
}

// Build year chips
(function(){
  const el = document.getElementById('chips-year-pub');
  if (!el) return;
  const cur = new Date().getFullYear();
  el.innerHTML = Array.from({length:12},(_,i)=>cur-i).map(y=>
    `<button class="form-chip" onclick="pickChip('year',this,${y})">${y}</button>`
  ).join('');
})();

function doPublish() {
  const makeCustom = document.getElementById('f-make-custom').value.trim();
  if (makeCustom) pub.make = makeCustom;
  pub.model = document.getElementById('f-model').value.trim();
  const yearCustom = document.getElementById('f-year-custom').value.trim();
  if (yearCustom) pub.year = yearCustom;
  pub.mileage = document.getElementById('f-mileage').value.trim();
  pub.price   = document.getElementById('f-price').value.trim();
  const transCustom = document.getElementById('f-trans-custom').value.trim();
  if (transCustom) pub.transmission = transCustom;
  const engCustom = document.getElementById('f-engine-custom').value.trim();
  if (engCustom) pub.engine = engCustom;
  const cityCustom = document.getElementById('f-city-custom').value.trim();
  if (cityCustom) pub.city = cityCustom;
  pub.phone = document.getElementById('f-phone').value.trim();
  pub.description = document.getElementById('f-description').value.trim();

  const required = [
    [pub.make,'Марка'],[pub.model,'Модель'],[pub.year,'Год выпуска'],
    [pub.mileage,'Пробег'],[pub.price,'Цена'],[pub.fuel,'Топливо'],
    [pub.transmission,'Коробка передач'],[pub.city,'Город'],[pub.description,'Описание'],
  ];
  for (const [val,label] of required) {
    if (!val) { tg.showAlert(`Заполните поле: ${label}`); return; }
  }
  if (pub.description.length < 15) { tg.showAlert('Описание слишком короткое.'); return; }

  tg.sendData(JSON.stringify({
    action:'publish',
    make:pub.make, model:pub.model, year:parseInt(pub.year),
    mileage:parseInt(pub.mileage), price:parseInt(pub.price),
    fuel:pub.fuel, transmission:pub.transmission,
    engine:pub.engine||'', city:pub.city,
    phone:pub.phone, description:pub.description,
  }));
}

// ── TABS ──
function showTab(name) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
}
const initTab = new URLSearchParams(window.location.search).get('tab')||'search';
showTab(initTab);
</script>
