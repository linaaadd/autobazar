<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AutoBazar NL</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:var(--tg-theme-bg-color,#1c1c1e);
  --bg2:var(--tg-theme-secondary-bg-color,#2c2c2e);
  --text:var(--tg-theme-text-color,#fff);
  --hint:var(--tg-theme-hint-color,#8e8e93);
  --link:var(--tg-theme-link-color,#3a8fd9);
  --btn:var(--tg-theme-button-color,#185fa5);
  --btntext:var(--tg-theme-button-text-color,#fff);
  --sep:rgba(128,128,128,0.18);
  --green:#30d158;
  --red:#ff453a;
  --orange:#ff9f0a;
  --purple:#bf5af2;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:68px;overflow-x:hidden}
#tabbar{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;background:var(--bg2);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 10px;background:none;border:none;cursor:pointer;color:var(--hint);font-size:10px;transition:color .15s}
.tab.active{color:var(--link)}
.tab svg{width:24px;height:24px;fill:currentColor}
.screen{display:none}.screen.active{display:block}
.screen-header{padding:18px 16px 6px;font-size:22px;font-weight:700;letter-spacing:-.4px}
.screen-sub{padding:0 16px 12px;font-size:13px;color:var(--hint)}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 10px}
.fbtn{background:var(--bg2);border:.5px solid var(--sep);border-radius:13px;padding:11px 12px;text-align:left;cursor:pointer;color:inherit;transition:border-color .15s;width:100%}
.fbtn.has-val{border-color:var(--link)}
.fbtn.full{grid-column:1/-1}
.fbtn-label{font-size:11px;color:var(--hint);display:block;margin-bottom:3px}
.fbtn-val{font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:space-between;gap:4px}
.fbtn.has-val .fbtn-val{color:var(--link)}
.fbtn-arrow{opacity:.4;font-size:16px;line-height:1;flex-shrink:0}
.fbtn-val span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.summary{margin:0 12px 10px;background:var(--bg2);border-radius:12px;padding:10px 13px;border-left:3px solid var(--link)}
.summary-label{font-size:11px;font-weight:600;color:var(--link);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.summary-val{font-size:13px;color:var(--hint);font-style:italic}
.btn{display:block;width:calc(100% - 24px);margin:6px 12px;padding:14px;border:none;border-radius:13px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s;font-family:inherit}
.btn:active{opacity:.8}
.btn-primary{background:var(--btn);color:var(--btntext)}
.btn-ai{background:linear-gradient(135deg,rgba(191,90,242,.2),rgba(58,143,217,.2));border:.5px solid var(--purple);color:var(--purple)}
.btn-secondary{background:var(--bg2);color:var(--link)}
.btn:disabled{opacity:.4}
.link-btn{font-size:13px;color:var(--link);background:none;border:none;cursor:pointer;padding:4px 12px 10px;display:block;font-family:inherit}
#panel{position:fixed;inset:0;z-index:200;background:var(--bg);transform:translateX(100%);transition:transform .27s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
#panel.open{transform:translateX(0)}
.panel-nav{display:flex;align-items:center;padding:12px 16px;border-bottom:.5px solid var(--sep);flex-shrink:0;gap:8px}
.panel-back{background:none;border:none;color:var(--link);font-size:15px;cursor:pointer;padding:4px 8px 4px 0;font-family:inherit}
.panel-title{font-size:17px;font-weight:600;flex:1}
.panel-reset{background:none;border:none;color:var(--red);font-size:13px;cursor:pointer;font-family:inherit}
.panel-body{padding:16px;overflow-y:auto;flex:1}
.panel-apply{flex-shrink:0;padding:8px 12px 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:.5px solid var(--sep);border-radius:20px;padding:7px 16px;font-size:14px;cursor:pointer;background:var(--bg2);color:var(--text);transition:all .15s;font-family:inherit}
.chip.sel{background:rgba(58,143,217,.15);border-color:var(--link);color:var(--link);font-weight:500}
.chip.sel::before{content:"✓ "}
.chip.turbo-chip.sel{background:rgba(255,159,10,.15);border-color:var(--orange);color:var(--orange)}
.chip.turbo-chip.sel::before{content:"⚡ "}
.inp{width:100%;padding:12px 13px;background:var(--bg2);border:.5px solid var(--sep);border-radius:11px;font-size:14px;color:var(--text);outline:none;font-family:inherit}
.inp:focus{border-color:var(--link)}
.inp::placeholder{color:var(--hint)}
textarea.inp{resize:none;line-height:1.5}
.range-row{display:flex;gap:8px}
.range-row .inp{flex:1}
.field-label{font-size:12px;color:var(--hint);margin:14px 0 6px;font-weight:500;text-transform:uppercase;letter-spacing:.3px}
.search-box{position:relative;margin-bottom:12px}
.search-box .inp{padding-left:36px}
.search-box::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none}
.ac-list{border:.5px solid var(--sep);border-radius:11px;overflow:hidden;margin-top:8px}
.ac-list:empty{display:none}
.ac-item{padding:12px 14px;background:var(--bg2);cursor:pointer;font-size:14px;border-bottom:.5px solid var(--sep)}
.ac-item:last-child{border-bottom:none}
.ac-item:active{background:var(--bg)}
.ac-item b{color:var(--link)}
.ac-sub{font-size:12px;color:var(--hint);margin-top:2px}
.ac-hint{padding:10px 14px;font-size:13px;color:var(--hint);background:var(--bg2)}
.listing-card{background:var(--bg2);border-radius:14px;margin:0 12px 10px;overflow:hidden}
.listing-card-header{padding:13px 14px 8px}
.listing-title{font-size:16px;font-weight:600}
.listing-meta{font-size:13px;color:var(--hint);margin-top:3px}
.listing-price{font-size:18px;font-weight:700;color:var(--link);margin-top:6px}
.listing-status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:20px;margin-top:6px}
.status-active{background:rgba(48,209,88,.15);color:var(--green)}
.status-hidden{background:rgba(255,159,10,.15);color:var(--orange)}
.status-expired{background:rgba(255,69,58,.15);color:var(--red)}
.listing-actions{display:grid;grid-template-columns:1fr 1fr;border-top:.5px solid var(--sep)}
.la-btn{background:none;border:none;border-right:.5px solid var(--sep);padding:11px 6px;font-size:12px;font-weight:500;cursor:pointer;color:var(--link);font-family:inherit;transition:background .15s}
.la-btn:last-child{border-right:none}
.la-btn:active{background:var(--sep)}
.la-btn.red{color:var(--red)}
.empty{text-align:center;padding:60px 24px}
.empty-ico{font-size:48px;margin-bottom:12px}
.empty-title{font-size:17px;font-weight:600;margin-bottom:6px}
.empty-sub{font-size:14px;color:var(--hint);line-height:1.4}
</style>
</head>
<body>

<div class="screen active" id="screen-search">
  <div class="screen-header">🔍 Поиск авто</div>
  <div class="summary"><div class="summary-label">Фильтры</div><div class="summary-val" id="s-summary">ничего не выбрано</div></div>
  <div class="filter-grid">
    <button class="fbtn" id="sfb-brand" onclick="openPanel('s','brand')"><span class="fbtn-label">Марка</span><span class="fbtn-val"><span id="sv-brand">Любая</span><span class="fbtn-arrow">›</span></span></button>
    <button class="fbtn" id="sfb-model" onclick="openPanel('s','model')"><span class="fbtn-label">Модель</span><span class="fbtn-val"><span id="sv-model">Любая</span><span class="fbtn-arrow">›</span></span></button>
    <button class="fbtn" id="sfb-year" onclick="openPanel('s','year')"><span class="fbtn-label">Год</span><span class="fbtn-val"><span id="sv-year">Любой</span><span class="fbtn-arrow">›</span></span></button>
    <button class="fbtn" id="sfb-price" onclick="openPanel('s','price')"><span class="fbtn-label">Цена (€)</span><span class="fbtn-val"><span id="sv-price">Любая</span><span class="fbtn-arrow">›</span></span></button>
    <button class="fbtn" id="sfb-fuel" onclick="openPanel('s','fuel')"><span class="fbtn-label">Топливо</span><span class="fbtn-val"><span id="sv-fuel">Любое</span><span class="fbtn-arrow">›</span></span></button>
    <button class="fbtn" id="sfb-trans" onclick="openPanel('s','trans')"><span class="fbtn-label">Коробка</span><span class="fbtn-val"><span id="sv-trans">Любая</span><span class="fbtn-arrow">›</span></span></button>
    <button class="fbtn full" id="sfb-city" onclick="openPanel('s','city')"><span class="fbtn-label">Город</span><span class="fbtn-val"><span id="sv-city">Любой</span><span class="fbtn-arrow">›</span></span></button>
  </div>
  <button class="link-btn" onclick="resetSearch()">✕ Сбросить фильтры</button>
  <button class="btn btn-primary" onclick="doSearch()">🔍 Найти автомобили</button>
</div>

<div class="screen" id="screen-publish">
  <div class="screen-header">📝 Подать объявление</div>
  <div class="screen-sub">Заполните данные — бот попросит фото</div>
  <div class="filter-grid">
    <button class="fbtn" id="pfb-make" onclick="openPanel('p','make')"><span class="fbtn-label">Марка *</span><span class="fbtn-val"><span id="pv-make">Выбрать</span><span class="fbtn-arrow">›</span></span></button>
    <button class="fbtn" id="pfb-pmodel" onclick="openPanel('p','pmodel')"><span class="fbtn-label">Модель *</span><span class="fbtn-val"><span id="pv-pmodel">Ввести</span><span class="fbtn-arrow">›</span></span></button>
    <button class="fbtn" id="pfb-pyear" onclick="openPanel('p','pyear')"><span class="fbtn-label">Год *</span><span class="fbtn-val"><span id="pv-pyear">Выбрать</span><span class="fbtn-arrow">›</span></span></button>
    <button class="fbtn" id="pfb-mileage" onclick="openPanel('p','mileage')"><span class="fbtn-label">Пробег (км) *</span><span class="fbtn-val"><span id="pv-mileage">Ввести</span><span class="fbtn-arrow">›</span></span></button>
    <button class="fbtn" id="pfb-pprice" onclick="openPanel('p','pprice')"><span class="fbtn-label">Цена (€) *</span><span class="fbtn-val"><span id="pv-pprice">Ввести</span><span class="fbtn-arrow">›</span></span></button>
    <button class="fbtn" id="pfb-pfuel" onclick="openPanel('p','pfuel')"><span class="fbtn-label">Топливо *</span><span class="fbtn-val"><span id="pv-pfuel">Выбрать</span><span class="fbtn-arrow">›</span></span></button>
    <button class="fbtn" id="pfb-ptrans" onclick="openPanel('p','ptrans')"><span class="fbtn-label">Коробка *</span><span class="fbtn-val"><span id="pv-ptrans">Выбрать</span><span class="fbtn-arrow">›</span></span></button>
    <button class="fbtn" id="pfb-engine" onclick="openPanel('p','engine')"><span class="fbtn-label">Двигатель</span><span class="fbtn-val"><span id="pv-engine">Не указан</span><span class="fbtn-arrow">›</span></span></button>
    <button class="fbtn full" id="pfb-pcity" onclick="openPanel('p','pcity')"><span class="fbtn-label">Город *</span><span class="fbtn-val"><span id="pv-pcity">Выбрать</span><span class="fbtn-arrow">›</span></span></button>
    <button class="fbtn full" id="pfb-desc" onclick="openPanel('p','desc')"><span class="fbtn-label">Описание *</span><span class="fbtn-val"><span id="pv-desc">Написать</span><span class="fbtn-arrow">›</span></span></button>
    <button class="fbtn full" id="pfb-phone" onclick="openPanel('p','phone')"><span class="fbtn-label">Телефон</span><span class="fbtn-val"><span id="pv-phone">Не указан</span><span class="fbtn-arrow">›</span></span></button>
  </div>
  <button class="btn btn-primary" onclick="doPublish()">📤 Отправить боту</button>
</div>

<div class="screen" id="screen-my">
  <div class="screen-header">📋 Мои объявления</div>
  <div id="my-list"></div>
</div>

<div id="panel">
  <div class="panel-nav">
    <button class="panel-back" onclick="closePanel()">‹ Назад</button>
    <span class="panel-title" id="panel-title"></span>
    <button class="panel-reset" onclick="resetPanel()">Сбросить</button>
  </div>
  <div class="panel-body" id="panel-body"></div>
  <div class="panel-apply" id="panel-apply"></div>
</div>

<div id="tabbar">
  <button class="tab active" id="tab-search" onclick="showTab('search')">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    Поиск
  </button>
  <button class="tab" id="tab-publish" onclick="showTab('publish')">
    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
    Подать
  </button>
  <button class="tab" id="tab-my" onclick="showTab('my')">
    <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
    Мои авто
  </button>
</div>

<script>
var tg=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:{
  ready:function(){},expand:function(){},
  sendData:function(d){alert(JSON.stringify(JSON.parse(d),null,2));},
  showAlert:function(m,cb){alert(m);if(cb)cb();},close:function(){}
};
tg.ready();tg.expand();

var CUR_YEAR=new Date().getFullYear();

// ── CAR DATABASE ──
// Popular brands shown immediately; full search via NHTSA API
var BRANDS_POPULAR=[
  'Audi','BMW','Chevrolet','Chrysler','Citroen','Cupra','Dacia','Dodge','DS','Ferrari',
  'Fiat','Ford','Honda','Hyundai','Infiniti','Jaguar','Jeep','Kia','Lamborghini',
  'Land Rover','Lexus','Maserati','Mazda','Mercedes-Benz','MG','Mini','Mitsubishi',
  'Nissan','Opel','Peugeot','Porsche','Renault','Rolls-Royce','Seat','Skoda','Smart',
  'Subaru','Suzuki','Tesla','Toyota','Volkswagen','Volvo','BYD','NIO','Lynk & Co',
  'Alfa Romeo','Aston Martin','Bentley','Bugatti','Cadillac','Genesis','GMC',
  'Great Wall','Haval','Honda','Isuzu','Lada','Lancia','Lincoln','Lotus','McLaren',
  'Mclaren','Polestar','RAM','Saab','SEAT','SsangYong','Trabant','Triumph'
];

var modelsCache={};

function fetchModels(make,cb){
  if(modelsCache[make]){cb(modelsCache[make]);return;}
  var url='https://vpic.nhtsa.dot.gov/api/vehicles/getmodelsformake/'+encodeURIComponent(make)+'?format=json';
  fetch(url)
    .then(function(r){return r.json();})
    .then(function(d){
      var models=(d.Results||[]).map(function(x){return x.Model_Name;}).sort();
      modelsCache[make]=models;
      cb(models);
    })
    .catch(function(){cb([]);});
}

var BRANDS=BRANDS_POPULAR;
var MODELS={};

var FUELS=['Бензин','Дизель','Газ/Бензин','Электро','Гибрид'];
var TRANS=['Автомат','Механика'];
var ENGINES=['1.0','1.2','1.4','1.6','1.8','2.0','2.5','3.0','3.5','4.0'];
var POP_CITIES=['Amsterdam','Rotterdam','Utrecht','Den Haag','Eindhoven','Tilburg','Groningen','Almere'];

var sv={brands:[],model:'',year_from:'',year_to:'',price_from:'',price_to:'',fuel:'',transmission:'',city:''};
var pv={make:'',model:'',year:'',mileage:'',price:'',fuel:'',transmission:'',engine:'',turbo:false,city:'',description:'',phone:''};
var panelCtx='',panelKey='';

function gi(id){return document.getElementById(id);}

// ── BRAND SEARCH ──
function buildBrandSearch(curSel,multiSelect){
  var html='<div class="search-box"><input class="inp" id="brand-q" placeholder="Поиск среди всех марок…" autocomplete="off" oninput="filterBrands(this.value)"></div>'
    +'<div class="ac-list" id="brand-ac"></div>'
    +'<div class="field-label">Популярные марки:</div>'
    +'<div class="chips" id="brand-chips">';
  for(var i=0;i<BRANDS_POPULAR.length;i++){
    var b=BRANDS_POPULAR[i];
    var sel=multiSelect?(curSel.indexOf(b)>=0):(curSel===b);
    html+='<button class="chip'+(sel?' sel':'')+'" data-v="'+b+'" onclick="selectBrand(\''+b+'\')">'+b+'</button>';
  }
  html+='</div>';
  return html;
}

var brandSearchTimer=null;
var allBrandsCache=null;

function loadAllBrands(cb){
  if(allBrandsCache){cb(allBrandsCache);return;}
  fetch('https://vpic.nhtsa.dot.gov/api/vehicles/getallmakes?format=json')
    .then(function(r){return r.json();})
    .then(function(d){
      allBrandsCache=(d.Results||[]).map(function(x){return x.Make_Name;}).sort();
      cb(allBrandsCache);
    })
    .catch(function(){cb(BRANDS_POPULAR);});
}

function selectBrand(b){
  var ac=gi('brand-ac');if(ac)ac.innerHTML='';
  var bq=gi('brand-q');if(bq)bq.value='';
  // ensure chip exists
  var chips=gi('brand-chips');
  if(chips&&!chips.querySelector('[data-v="'+b+'"]')){
    var btn=document.createElement('button');
    btn.className='chip';btn.setAttribute('data-v',b);btn.textContent=b;
    btn.onclick=function(){
      if(panelCtx==='s')toggleBrand(b,this);
      else{pv.make=b;chips.querySelectorAll('.chip').forEach(function(c){c.classList.toggle('sel',c.getAttribute('data-v')===b);});}
    };
    chips.insertBefore(btn,chips.firstChild);
  }
  if(panelCtx==='s'){
    var el=chips?chips.querySelector('[data-v="'+b+'"]'):null;
    toggleBrand(b,el);
  } else {
    pv.make=b;pv.model='';
    if(chips)chips.querySelectorAll('.chip').forEach(function(c){c.classList.toggle('sel',c.getAttribute('data-v')===b);});
    applyPanel();
    setTimeout(function(){openPanel('p','pmodel');},280);
  }
  if(chips)chips.querySelectorAll('.chip').forEach(function(c){c.style.display='';});
}

function filterBrands(q){
  var chips=gi('brand-chips');
  var ac=gi('brand-ac');
  if(!chips)return;
  var lower=(q||'').toLowerCase();
  chips.querySelectorAll('.chip').forEach(function(c){
    c.style.display=!q||c.getAttribute('data-v').toLowerCase().indexOf(lower)>=0?'':'none';
  });
  clearTimeout(brandSearchTimer);
  if(q.length<2){ac.innerHTML='';return;}
  ac.innerHTML='<div class="ac-hint">Поиск среди всех марок…</div>';
  brandSearchTimer=setTimeout(function(){
    loadAllBrands(function(all){
      var re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
      var matches=all.filter(function(b){return re.test(b);}).slice(0,15);
      if(!matches.length){ac.innerHTML='<div class="ac-hint">Не найдено</div>';return;}
      ac.innerHTML=matches.map(function(b){
        var hl=b.replace(re,'<b>$&</b>');
        return '<div class="ac-item" data-brand="'+b.replace(/"/g,'&quot;')+'">'+hl+'</div>';
      }).join('');
      ac.querySelectorAll('.ac-item').forEach(function(el){
        el.onclick=function(){selectBrand(this.getAttribute('data-brand'));};
      });
    });
  },400);
}

// ── MODEL AUTOCOMPLETE (NHTSA API) ──
function buildModelSearch(currentVal,currentBrand,stateKey){
  var ph=currentBrand?currentBrand+': введите модель…':'Сначала выберите марку или введите вручную…';
  var html='<div class="search-box"><input class="inp" id="model-q" placeholder="'+ph+'" value="'+currentVal+'" autocomplete="off" oninput="filterModels(this.value,\''+stateKey+'\')"></div>'
    +'<div class="ac-list" id="model-ac"><div class="ac-hint" id="model-hint">'+(currentBrand?'Загрузка моделей…':'Выберите марку чтобы увидеть модели')+'</div></div>';
  if(currentBrand){
    fetchModels(currentBrand,function(models){
      var mc=gi('model-ac');if(!mc)return;
      if(!models.length){mc.innerHTML='<div class="ac-hint">Модели не найдены</div>';return;}
      var cur=gi('model-q')?gi('model-q').value:'';
      renderModelChips(models,cur,stateKey);
    });
  }
  return html;
}

function renderModelChips(models,q,stateKey){
  var mc=gi('model-ac');if(!mc)return;
  var lower=(q||'').toLowerCase();
  var filtered=lower?models.filter(function(m){return m.toLowerCase().indexOf(lower)>=0;}):models;
  if(!filtered.length){mc.innerHTML='<div class="ac-hint">Ничего не найдено</div>';return;}
  var curVal=stateKey==='sv'?sv.model:pv.model;
  mc.innerHTML='<div class="chips" style="padding:10px;gap:8px;" id="model-chips">'
    +filtered.slice(0,80).map(function(m){
      return '<button class="chip'+(curVal===m?' sel':'')+'" data-v="'+m.replace(/"/g,'&quot;')+'" onclick="pickModel(\''+m.replace(/'/g,"\\'")+"',this,'"+stateKey+"')\">"+m+'</button>';
    }).join('')+'</div>'
    +(filtered.length>80?'<div class="ac-hint">Уточните запрос — показано 80 из '+filtered.length+'</div>':'');
}

function filterModels(q,stateKey){
  var brand=panelCtx==='s'?sv.brands[0]:pv.make;
  if(!brand){
    // free search across all cached
    var allModels=[];
    Object.keys(modelsCache).forEach(function(k){allModels=allModels.concat(modelsCache[k]);});
    if(q.length>=2) renderModelChips(allModels.filter(function(m,i,a){return a.indexOf(m)===i;}),q,stateKey);
    return;
  }
  if(modelsCache[brand]){
    renderModelChips(modelsCache[brand],q,stateKey);
  } else {
    fetchModels(brand,function(models){renderModelChips(models,q,stateKey);});
  }
}

function pickModel(m,el,stateKey){
  if(stateKey==='sv')sv.model=m;else pv.model=m;
  var mq=gi('model-q');if(mq)mq.value=m;
  var chips=gi('model-chips');
  if(chips){chips.querySelectorAll('.chip').forEach(function(c){c.classList.toggle('sel',c.getAttribute('data-v')===m);});}
}

// ── NOMINATIM CITY ──
var nomTimer=null;
function nomSearch(q,resId,onSelect){
  var res=gi(resId);
  clearTimeout(nomTimer);
  if(!q||q.length<2){res.innerHTML='';return;}
  res.innerHTML='<div class="ac-hint">Поиск…</div>';
  nomTimer=setTimeout(function(){
    fetch('https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=6&countrycodes=nl&q='+encodeURIComponent(q),{headers:{'Accept-Language':'ru'}})
      .then(function(r){return r.json();})
      .then(function(data){
        if(!data.length){res.innerHTML='<div class="ac-hint">Ничего не найдено</div>';return;}
        res.innerHTML=data.map(function(d){
          var name=d.address.city||d.address.town||d.address.village||d.address.municipality||d.name;
          var sub=[d.address.state,d.address.country].filter(Boolean).join(', ');
          return '<div class="ac-item"><div>'+name+'</div>'+(sub?'<div class="ac-sub">'+sub+'</div>':'')+'</div>';
        }).join('');
        res.querySelectorAll('.ac-item').forEach(function(el,i){
          var d=data[i];
          var name=d.address.city||d.address.town||d.address.village||d.address.municipality||d.name;
          el.onclick=function(){onSelect(name);res.innerHTML='';};
        });
      })
      .catch(function(){res.innerHTML='<div class="ac-hint">Ошибка поиска</div>';});
  },350);
}

function engineLabel(){
  if(!pv.engine&&!pv.turbo)return'Не указан';
  var parts=[];
  if(pv.engine)parts.push(pv.engine+' л');

  return parts.join(' · ');
}

function openPanel(ctx,key){
  panelCtx=ctx;panelKey=key;
  var def=PDEFS[ctx+'_'+key];if(!def)return;
  gi('panel-title').textContent=def.title;
  gi('panel-body').innerHTML=def.build();
  gi('panel-apply').innerHTML='<button class="btn btn-primary" onclick="applyPanel()">Применить</button>';
  gi('panel').classList.add('open');
}
function closePanel(){gi('panel').classList.remove('open');updateSummary();}
function applyPanel(){var d=PDEFS[panelCtx+'_'+panelKey];if(d)d.apply();closePanel();}
function resetPanel(){var d=PDEFS[panelCtx+'_'+panelKey];if(d)d.reset();closePanel();}

function toggleBrand(b,el){
  var i=sv.brands.indexOf(b);
  if(i>=0){sv.brands.splice(i,1);if(el)el.classList.remove('sel');}
  else{sv.brands.push(b);if(el)el.classList.add('sel');}
}
function ccs(id){var e=gi(id);if(e)e.querySelectorAll('.chip').forEach(function(c){c.classList.remove('sel');});}
function setMax(v,el){sv.price_to=v;var e=gi('p-pt');if(e)e.value=v;ccs('pp');el.classList.add('sel');}
function p1c(obj,key,val,el){
  window[obj][key]=val;
  var p=el.closest('.chips');if(p)p.querySelectorAll('.chip').forEach(function(c){c.classList.remove('sel');});
  el.classList.add('sel');applyPanel();
}
function pp1c(key,val,el){
  pv[key]=val;
  var p=el.closest('.chips');if(p)p.querySelectorAll('.chip').forEach(function(c){c.classList.remove('sel');});
  el.classList.add('sel');applyPanel();
}

function aiImprove(){
  var txt=(gi('pi').value||'').trim();
  if(txt.length<10){tg.showAlert('Сначала напишите описание.');return;}
  pv.description=txt;
  tg.sendData(JSON.stringify({action:'ai_improve_desc',text:txt}));
}

function updS(key,vid,label){
  gi(vid).textContent=label;
  gi('sfb-'+key).classList.toggle('has-val',['Любая','Любой','Любое'].indexOf(label)<0);
}
function updP(key,vid,label){
  gi(vid).textContent=label;
  var fb=gi('pfb-'+key);
  if(fb)fb.classList.toggle('has-val',['Выбрать','Ввести','Не указан','Написать'].indexOf(label)<0);
}
function updateSummary(){
  var parts=[];
  if(sv.brands.length)parts.push(sv.brands.join(', '));
  if(sv.model)parts.push(sv.model);
  if(sv.year_from||sv.year_to)parts.push((sv.year_from||'?')+'–'+(sv.year_to||'?'));
  if(sv.price_from||sv.price_to){function f(v){return v?'€'+Number(v).toLocaleString('ru'):'?';}parts.push(f(sv.price_from)+'–'+f(sv.price_to));}
  if(sv.fuel)parts.push(sv.fuel);
  if(sv.transmission)parts.push(sv.transmission);
  if(sv.city)parts.push(sv.city);
  var el=gi('s-summary');
  el.textContent=parts.length?parts.join(' · '):'ничего не выбрано';
  el.style.fontStyle=parts.length?'normal':'italic';
  el.style.color=parts.length?'var(--text)':'var(--hint)';
}

  sv={brands:[],model:'',year_from:'',year_to:'',price_from:'',price_to:'',fuel:'',transmission:'',city:''};
  ['brand|sv-brand|Любая','model|sv-model|Любая','year|sv-year|Любой','price|sv-price|Любая','fuel|sv-fuel|Любое','trans|sv-trans|Любая','city|sv-city|Любой'].forEach(function(s){var p=s.split('|');updS(p[0],p[1],p[2]);});
}
function doSearch(){
  tg.sendData(JSON.stringify({action:'search',brands:sv.brands.length?sv.brands:null,model:sv.model||null,year_from:sv.year_from||null,year_to:sv.year_to||null,price_from:sv.price_from||null,price_to:sv.price_to||null,fuel:sv.fuel||null,transmission:sv.transmission||null,city:sv.city||null}));
}
function doPublish(){
  var req=[['make','Марка'],['model','Модель'],['year','Год'],['mileage','Пробег'],['price','Цена'],['fuel','Топливо'],['transmission','Коробка'],['city','Город'],['description','Описание']];
  for(var i=0;i<req.length;i++){if(!pv[req[i][0]]&&pv[req[i][0]]!==0){tg.showAlert('Заполните: '+req[i][1]);return;}}
  if((pv.description||'').length<15){tg.showAlert('Описание слишком короткое.');return;}
  tg.sendData(JSON.stringify({action:'publish',make:pv.make,model:pv.model,year:+pv.year,mileage:+pv.mileage,price:+pv.price,fuel:pv.fuel,transmission:pv.transmission,engine:pv.engine||null,turbo:pv.turbo,city:pv.city,description:pv.description,phone:pv.phone||null}));
}

  var el=gi('my-list');
  if(!MOCK.length){el.innerHTML='<div class="empty"><div class="empty-ico">🚗</div><div class="empty-title">Нет объявлений</div><div class="empty-sub">Подайте первое объявление и оно появится здесь</div></div><button class="btn btn-primary" onclick="showTab(\'publish\')">📝 Подать объявление</button>';return;}
  el.innerHTML=MOCK.map(function(l){
    var sc=l.status==='hidden'?'status-hidden':l.days_left<=3?'status-expired':'status-active';
    var st=l.status==='hidden'?'🙈 Скрыто':l.days_left<=3?'⏰ '+l.days_left+' дн.':'✅ '+l.days_left+' дн.';
    return '<div class="listing-card"><div class="listing-card-header"><div class="listing-title">'+l.make+' '+l.model+' '+l.year+'</div><div class="listing-meta">📍 '+l.city+' · 🛣 '+Number(l.mileage).toLocaleString('ru')+' км</div><div class="listing-price">€'+Number(l.price).toLocaleString('ru')+'</div><span class="listing-status '+sc+'">'+st+'</span></div><div class="listing-actions"><button class="la-btn" onclick="act(\'edit\','+l.id+')">✏️ Изменить</button><button class="la-btn" onclick="act(\''+(l.status==='hidden'?'unhide':'hide')+'\','+l.id+')">'+(l.status==='hidden'?'👁 Показать':'🙈 Скрыть')+'</button><button class="la-btn" onclick="act(\'extend\','+l.id+')">🔄 Продлить</button><button class="la-btn red" onclick="act(\'delete\','+l.id+')">🗑 Удалить</button></div></div>';
  }).join('');
}
function act(a,id){tg.sendData(JSON.stringify({action:a,id:id}));}

function showTab(name){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  gi('screen-'+name).classList.add('active');
  gi('tab-'+name).classList.add('active');
  if(name==='my')renderMyListings();
}
showTab((new URLSearchParams(location.search)).get('tab')||'search');
</script>
</body>
</html>
